<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#15144E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Innovation Marketplace">
<title>لوحة التحكم | Innovation Marketplace — حاضنة ابتكار 5</title>
<meta name="theme-color" content="#0B1F3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap');

:root{
  --navy:#15144E;
  --navy-2:#1E1D63;
  --navy-3:#282775;
  --purple:#9A05B9;
  --purple-dark:#4C0C7A;
  --gold:#FCC342;
  --gold-dark:#C89C45;
  --teal:#00BF9D;
  --teal-dark:#0F3B60;
  --green:#63D653;
  --green-dark:#2C5050;
  --white:#FFFFFF;
  --paper:#FFFFFF;
  --ink:#15144E;
  --muted:#6B6F93;
  --line:rgba(21,20,78,0.12);
  --danger:#C24B4B;
  --radius:16px;
  --shadow: 0 10px 30px -12px rgba(21,20,78,0.28);

  /* دلالة الألوان حسب مراحل حاضنة ابتكار الفعلية:
     الاستكشاف = أخضر (كبداية الهاكثون) | التقييم = بنفسجي (لون "التحكيم") | النتائج = تركوازي (لون "معرض الابتكار") */
  --phase-explore:var(--green);
  --phase-evaluation:var(--purple);
  --phase-results:var(--teal);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Tajawal',sans-serif;
  background:var(--paper);
  color:var(--ink);
  direction:rtl;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
::selection{background:var(--gold);}

/* ---------- شريط الوسوم الزخرفي (العنصر المميز من الهوية) ---------- */
.brand-ticks{
  display:flex; align-items:flex-end; gap:5px; height:22px; padding:0 18px;
  overflow:hidden;
}
.brand-ticks span{width:2px; border-radius:2px; flex-shrink:0;}

/* ---------- شعار حاضنة ابتكار 5 ---------- */
.logo-lockup{display:flex; align-items:center; gap:9px;}
.logo-num-box{
  width:24px; height:24px; border:2px solid var(--navy); border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  font-weight:900; font-size:12.5px; color:var(--navy); flex-shrink:0;
}
.logo-num-box.on-dark{border-color:#fff; color:#fff;}
.logo-text{line-height:1.2;}
.logo-text b{font-size:14.5px; font-weight:800; display:block; color:var(--navy);}
.logo-text .en{font-size:8.5px; letter-spacing:1.2px; color:var(--muted); display:block; text-transform:uppercase;}
.logo-lockup.on-dark .logo-text b{color:#fff;}
.logo-lockup.on-dark .logo-text .en{color:rgba(255,255,255,0.65);}

/* ---------- Layout shells ---------- */
.app{max-width:520px; margin:0 auto; min-height:100vh; background:var(--paper); position:relative; display:flex; flex-direction:column;}
.app.wide{max-width:1100px;}

.topbar{
  position:sticky; top:0; z-index:40; background:#fff; color:var(--navy);
  padding:14px 18px 0; box-shadow:0 2px 14px rgba(21,20,78,0.06);
}
.topbar .toprow{display:flex; align-items:center; justify-content:space-between; padding-bottom:12px;}
.topbar .phase-pill{
  font-size:11px; font-weight:800; padding:6px 12px; border-radius:999px; color:#fff;
}

.content{flex:1; padding:18px 16px 90px;}

/* ---------- Buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; cursor:pointer; font-family:inherit; padding:13px 20px; border-radius:12px; font-weight:800; font-size:14.5px; transition:transform .12s, box-shadow .12s, opacity .12s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--navy); color:#fff;}
.btn-primary:hover{background:var(--navy-3);}
.btn-gold{background:var(--gold); color:var(--navy);}
.btn-teal{background:var(--teal); color:#fff;}
.btn-purple{background:var(--purple); color:#fff;}
.btn-outline{background:transparent; border:1.5px solid var(--line); color:var(--ink);}
.btn-block{width:100%;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn-sm{padding:8px 14px; font-size:12.5px; border-radius:9px;}

/* ---------- Cards ---------- */
.card{background:#fff; border-radius:var(--radius); padding:16px; box-shadow:0 2px 14px rgba(21,20,78,0.07); border:1px solid var(--line);}
.company-card{display:flex; align-items:center; gap:14px; cursor:pointer; margin-bottom:12px; position:relative; overflow:hidden;}
.company-card::before{content:''; position:absolute; inset-inline-start:0; top:0; bottom:0; width:4px; background:var(--teal);}
.company-card .emoji{width:52px;height:52px;border-radius:12px;background:#F4F3FB; display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.company-card .info{flex:1; min-width:0;}
.company-card .info b{font-size:15.5px; display:block;}
.company-card .info span{font-size:12px; color:var(--muted);}
.company-card .badges{display:flex; gap:6px; margin-top:6px;}
.badge{font-size:10px; font-weight:800; padding:3px 8px; border-radius:999px;}
.badge.visited{background:rgba(0,191,157,0.14); color:var(--teal-dark);}
.badge.watch{background:rgba(252,195,66,0.22); color:#8a6a1f;}
.chev{color:var(--muted); font-size:18px;}

/* ---------- Detail page ---------- */
.hero-block{background:var(--navy); color:#fff; border-radius:var(--radius); padding:22px 18px; margin-bottom:16px; position:relative; overflow:hidden;}
.hero-block::after{content:''; position:absolute; inset-inline-end:-40px; top:-40px; width:150px;height:150px; border-radius:50%; background:radial-gradient(circle, rgba(0,191,157,.35), transparent 70%); pointer-events:none;}
.hero-block .sector{font-size:11px; color:var(--gold); font-weight:700; letter-spacing:.5px;}
.hero-block h1{font-size:22px; margin:6px 0 4px; font-weight:900;}
.hero-block .booth{font-size:12.5px; color:rgba(255,255,255,.75); display:flex; align-items:center; gap:6px;}

.section-title{font-size:13px; font-weight:800; color:var(--navy); margin:18px 0 8px; display:flex; align-items:center; gap:6px;}
.section-title::before{content:''; width:4px; height:14px; background:var(--gold); border-radius:2px;}
.acc-section{margin-bottom:14px; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff; transition:box-shadow .25s ease, border-color .25s ease;}
.acc-section[open]{box-shadow:0 6px 24px rgba(21,20,78,0.07); border-color:#e2dff7;}
.acc-section > summary{display:flex; align-items:center; justify-content:space-between; cursor:pointer; padding:15px 18px; background:#fbfbfe; list-style:none; user-select:none; transition:background-color .18s ease;}
.acc-section > summary:hover{background:#f2f1fb;}
.acc-section > summary:active{background:#ecebf9;}
.acc-section > summary::-webkit-details-marker{display:none;}
.acc-title{font-size:13.5px; font-weight:800; color:var(--navy); display:flex; align-items:center; gap:9px;}
.acc-title::before{content:''; width:4px; height:15px; background:var(--gold); border-radius:2px; flex-shrink:0; transition:height .2s ease;}
.acc-chev{color:var(--muted); transition:transform .28s cubic-bezier(.4,0,.2,1), color .2s ease; flex-shrink:0;}
.acc-section[open] > summary .acc-chev{transform:rotate(90deg); color:var(--purple);}
.acc-body{padding:17px 18px; border-top:1px solid var(--line); overflow:hidden;}
.body-text{font-size:14px; line-height:1.9; color:#333;}
.action-row{display:flex; gap:10px; margin-top:20px;}
input, select, textarea{transition:border-color .15s ease, box-shadow .15s ease;}
input:focus, select:focus, textarea:focus{border-color:var(--purple); box-shadow:0 0 0 3px rgba(154,5,185,0.08); outline:none;}
.btn{transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;}
.btn:active{transform:scale(.97);}
.card, .stat-card{transition:box-shadow .2s ease;}
.icon-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:6px;}
.icon-tile{border:1.5px solid var(--line); border-radius:12px; padding:10px 6px; text-align:center; cursor:pointer; transition:border-color .15s ease, background-color .15s ease, transform .1s ease;}
.icon-tile:hover{border-color:var(--teal); background:#f7fdfc;}
.icon-tile:active{transform:scale(.96);}
.icon-tile.selected{border-color:var(--purple); background:rgba(154,5,185,0.06); box-shadow:0 0 0 1px var(--purple);}
.icon-tile-icon{display:flex; align-items:center; justify-content:center; color:var(--navy); margin-bottom:5px;}
.icon-tile.selected .icon-tile-icon{color:var(--purple);}
.icon-tile-label{font-size:10.5px; font-weight:700; color:var(--muted); line-height:1.3;}
.icon-tile.selected .icon-tile-label{color:var(--purple);}
.dashboard-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:16px; align-items:start;}
.dashboard-grid .acc-section{margin-bottom:0;}
.dashboard-grid .span-2{grid-column:span 2;}
.dashboard-grid .span-full{grid-column:1 / -1;}
@media (max-width:700px){
  .dashboard-grid .span-2{grid-column:span 1;}
}
.category-panel[data-active="true"]{display:contents;}
.category-panel[data-active="false"]{display:none;}
.category-nav{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; position:sticky; top:0; z-index:30; background:#F4F3FB; padding:10px 0;}
.category-pill{
  display:flex; align-items:center; gap:7px; padding:9px 16px; border-radius:999px; border:1.5px solid var(--line);
  background:#fff; font-size:13px; font-weight:700; color:var(--navy); cursor:pointer; transition:all .15s ease; white-space:nowrap;
}
.category-pill:hover{border-color:var(--teal); background:#f7fdfc;}
.category-pill.active{background:var(--navy); border-color:var(--navy); color:#fff;}
.category-pill .count-badge{
  background:rgba(255,255,255,0.25); border-radius:999px; padding:1px 7px; font-size:11px; font-weight:800;
}
.category-pill:not(.active) .count-badge{background:var(--cream,#F4F3FB); color:var(--navy);}
.category-pill.active .count-badge.danger{background:var(--danger); color:#fff;}

#overviewBar{display:flex; gap:10px; overflow-x:auto; padding-bottom:10px;}
.mini-stat{
  display:flex; align-items:center; gap:10px; padding:9px 14px; border-radius:12px;
  border:1px solid var(--line); min-width:150px; flex-shrink:0; transition:box-shadow .15s ease;
}
.mini-stat.clickable{cursor:pointer;}
.mini-stat.clickable:hover{box-shadow:0 4px 14px rgba(21,20,78,0.09);}
.mini-stat-icon{
  width:34px; height:34px; border-radius:9px; background:rgba(154,5,185,0.08);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.mini-stat-body{min-width:0;}
.mini-stat-num{font-weight:900; font-size:16px; line-height:1.2; white-space:nowrap; max-width:130px; overflow:hidden; text-overflow:ellipsis;}
.mini-stat-lbl{font-size:10.5px; color:var(--muted); white-space:nowrap;}
.mini-stat-progress{height:4px; border-radius:3px; background:var(--line); margin-top:4px; overflow:hidden; width:100%;}
.mini-stat-progress > div{height:100%; border-radius:3px; transition:width .4s ease;}

.admin-modal-overlay{
  position:fixed; inset:0; z-index:200; background:rgba(21,20,78,0.55);
  display:flex; align-items:flex-start; justify-content:center; padding:40px 16px;
  overflow-y:auto;
}
.admin-modal-card{
  background:#fff; border-radius:18px; padding:24px; max-width:640px; width:100%;
  box-shadow:0 20px 60px rgba(21,20,78,0.3); margin-bottom:40px;
}
.admin-modal-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
.admin-modal-close{cursor:pointer; width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; background:#F4F3FB; color:var(--navy);}

.filter-toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
.filter-toolbar input[type="text"], .filter-toolbar select{margin-bottom:0; width:auto; min-width:120px; flex:1;}
.filter-toolbar input[type="text"]{flex:2; min-width:160px;}
th.sortable{cursor:pointer; user-select:none; white-space:nowrap; transition:color .15s ease;}
th.sortable:hover{color:var(--purple);}
.rank-bar-row{margin-bottom:12px;}
.rank-bar-row .rank-bar-label{display:flex; justify-content:space-between; align-items:center; font-size:13px; margin-bottom:5px;}
.rank-bar-track{background:#eeecf7; border-radius:8px; height:20px; overflow:hidden;}
.rank-bar-fill{height:100%; border-radius:8px; background:linear-gradient(90deg,var(--purple-dark),var(--purple)); display:flex; align-items:center; justify-content:flex-end; padding-inline-end:8px; color:#fff; font-size:11px; font-weight:800; transition:width .4s ease;}
.sector-bar-fill{background:linear-gradient(90deg,var(--teal-dark),var(--teal));}
@media print{
  body *{visibility:hidden;}
  #analysisPrintArea, #analysisPrintArea *{visibility:visible;}
  #analysisPrintArea{position:absolute; top:0; right:0; left:0; width:100%;}
  .no-print{display:none !important;}
}

/* ---------- Star rating ---------- */
.rating-block{margin-bottom:20px;}
.rating-block .rlabel{font-size:14px; font-weight:800; margin-bottom:8px;}
.stars{display:flex; gap:6px; direction:ltr; justify-content:flex-end;}
.stars .star{font-size:30px; cursor:pointer; color:#E3E2F0; transition:color .1s, transform .1s; user-select:none;}
.stars .star.filled{color:var(--purple);}
.stars .star:active{transform:scale(1.2);}

.invest-options{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
.invest-chip{padding:10px 16px; border-radius:12px; border:1.5px solid var(--line); background:#fff; font-weight:800; font-size:14px; cursor:pointer; min-width:64px; text-align:center;}
.invest-chip.selected{background:var(--purple); color:#fff; border-color:var(--purple);}

/* ---------- Progress ---------- */
.progress-wrap{background:#fff; border-radius:14px; padding:16px; border:1px solid var(--line);}
.progress-bar{height:14px; background:#F1F0F9; border-radius:999px; overflow:hidden; margin-top:10px;}
.progress-bar > div{height:100%; background:linear-gradient(90deg,var(--teal-dark),var(--teal)); border-radius:999px; transition:width .5s ease;}
.progress-num{font-size:34px; font-weight:900; color:var(--navy);}

/* ---------- Empty / lock states ---------- */
.empty-state{text-align:center; padding:50px 20px; color:var(--muted);}
.empty-state .icon{font-size:40px; margin-bottom:10px;}
.empty-state h3{color:var(--ink); font-size:16px; margin-bottom:6px;}
.empty-state p{font-size:13px; line-height:1.7;}

/* ---------- Bottom tabbar ---------- */
.tabbar{position:fixed; bottom:0; left:0; right:0; z-index:50; max-width:520px; margin:0 auto; background:#fff; border-top:1px solid var(--line); display:flex; padding:8px 6px calc(env(safe-area-inset-bottom) + 8px); box-shadow:0 -6px 20px rgba(21,20,78,0.07);}
.tabbar .tab{flex:1; text-align:center; padding:8px 4px; border-radius:12px; cursor:pointer; color:var(--muted); font-size:11px; font-weight:700;}
.tabbar .tab .ticon{font-size:19px; display:block; margin-bottom:2px;}
.tabbar .tab.active{color:var(--navy); background:#F4F3FB;}

/* ---------- Podium / results ---------- */
.podium{display:flex; align-items:flex-end; gap:10px; justify-content:center; margin:30px 0;}
.podium .p{flex:1; max-width:140px; background:#fff; border:1px solid var(--line); border-radius:14px 14px 0 0; text-align:center; padding:14px 8px; position:relative;}
.podium .p.first{background:linear-gradient(180deg,#fff, #FFF6E0); border-color:var(--gold); order:2; padding-top:26px;}
.podium .p.second{order:1;}
.podium .p.third{order:3;}
.podium .medal{font-size:30px;}
.podium .pname{font-weight:800; font-size:13px; margin-top:6px;}
.podium .pval{font-size:11px; color:var(--teal-dark); font-weight:800; margin-top:4px;}

.leaderboard-row{display:flex; align-items:center; gap:12px; padding:12px; background:#fff; border-radius:12px; border:1px solid var(--line); margin-bottom:8px;}
.leaderboard-row .rank{width:28px;height:28px;border-radius:50%;background:#F4F3FB; display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12.5px;color:var(--navy); flex-shrink:0;}
.leaderboard-row .rname{flex:1; font-weight:800; font-size:14px;}
.leaderboard-row .rval{font-weight:900; color:var(--teal-dark); font-size:13px;}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; background:var(--navy); position:relative; overflow:hidden;}
.login-wrap::before{content:''; position:absolute; inset-inline-start:-80px; top:-80px; width:260px;height:260px; border-radius:50%; background:radial-gradient(circle, rgba(0,191,157,.35), transparent 70%); pointer-events:none;}
.login-wrap::after{content:''; position:absolute; inset-inline-end:-60px; bottom:-60px; width:220px;height:220px; border-radius:50%; background:radial-gradient(circle, rgba(154,5,185,.30), transparent 70%); pointer-events:none;}
.login-card{background:#fff; border-radius:20px; padding:28px 24px; width:100%; max-width:380px; position:relative; z-index:2; box-shadow:0 25px 60px rgba(0,0,0,.35);}
.login-logo{display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:16px;}
.login-title{text-align:center; font-weight:900; font-size:19px; color:var(--navy); margin-top:4px;}
.login-sub{text-align:center; font-size:12px; color:var(--muted); margin-bottom:20px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:700; margin-bottom:6px; color:var(--navy);}
.field input{width:100%; padding:12px 14px; border-radius:11px; border:1.5px solid var(--line); font-family:inherit; font-size:14px; background:#FAFAFD;}
.field input:focus{outline:none; border-color:var(--teal);}

/* ---------- Watchlist star toggle ---------- */
.star-toggle{position:absolute; top:16px; left:16px; width:36px;height:36px; border-radius:50%; background:rgba(255,255,255,.15); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px; border:1px solid rgba(255,255,255,.3);}
.star-toggle.on{background:var(--gold); color:var(--navy); border-color:var(--gold);}

/* ---------- misc ---------- */
.muted{color:var(--muted); font-size:12.5px;}
.center{text-align:center;}
.mt8{margin-top:8px;} .mt16{margin-top:16px;} .mt24{margin-top:24px;}
.toast{position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:12px 20px; border-radius:12px; font-size:13px; font-weight:700; z-index:100; box-shadow:var(--shadow); opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; display:flex; align-items:center; gap:8px; white-space:nowrap;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

.lock-banner{background:#F4F3FB; border:1px dashed var(--line); border-radius:14px; padding:16px; text-align:center; margin-bottom:14px; font-size:12.5px; color:var(--muted);}

.footer-brand{text-align:center; padding:18px 16px 30px; font-size:11px; color:var(--muted);}
.footer-brand b{color:var(--navy);}

/* Admin specific */
.admin-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:700px){.admin-grid{grid-template-columns:1fr;}}
.stat-card{background:#fff; border-radius:14px; padding:18px; border:1px solid var(--line); border-top:3px solid var(--teal);}
.stat-card .num{font-size:28px; font-weight:900; color:var(--navy);}
.stat-card .lbl{font-size:12px; color:var(--muted); font-weight:700;}
table{width:100%; border-collapse:collapse; font-size:13px;}
th,td{padding:10px; text-align:right; border-bottom:1px solid var(--line);}
th{color:var(--muted); font-weight:700; font-size:11.5px;}
textarea{width:100%; padding:12px; border-radius:11px; border:1.5px solid var(--line); font-family:inherit; font-size:13.5px; background:#FAFAFD; resize:vertical; min-height:70px;}
select{width:100%; padding:12px; border-radius:11px; border:1.5px solid var(--line); font-family:inherit; font-size:14px; background:#FAFAFD;}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>

<!-- ============ شاشة الدخول / إنشاء الحساب ============ -->
<div id="authScreen" class="login-wrap">
  <div class="login-card">
    <div class="login-logo" id="authLoginLogo"></div>
    <div class="login-title">لوحة تحكم المنظّم</div>
    <div class="program-name">Innovation Marketplace</div>
    <div class="login-sub" id="authSub">جاري التحقق...</div>

    <div id="authLoginForm" style="display:none;">
      <div class="field">
        <label>اسم المستخدم</label>
        <input id="adminUsername" type="text" autocomplete="username" placeholder="admin">
      </div>
      <div class="field">
        <label>كلمة المرور</label>

/* ============================================================

const DB = {
  async getPhase(){
    if (DEMO_MODE) return demoStore.event_state.phase;
    const { data, error } = await supabaseClient.from('event_state').select('phase').eq('id',1).single();

  async setPhase(phase){

  async getBudget(){
    if (DEMO_MODE) return demoStore.event_state.investor_budget ?? 5000;
    const { data, error } = await supabaseClient.from('event_state').select('investor_budget').eq('id',1).single();
    if (error) throw error;
    return data?.investor_budget ?? 5000;
  },
  async setBudget(amount){
    amount = Math.max(0, parseInt(amount) || 0);
    if (DEMO_MODE){ demoStore.event_state.investor_budget = amount; return; }

  async getSettings(){

      min_companies_required: 1, winner_count: 3, winner_formula: 'composite',
      evaluation_frozen: false, results_hidden: false, registration_open: true, evaluation_ends_at: null,
      explore_ends_at: null, active_group: null, known_groups: [], broadcast_message: null, broadcast_message_at: null
    };
    if (DEMO_MODE) return { ...defaults, ...demoStore.event_state };
    const { data, error } = await supabaseClient.from('event_state')
      .select('investor_budget,min_investment_per_company,max_investment_per_company,min_companies_required,winner_count,winner_formula,evaluation_frozen,results_hidden,registration_open,evaluation_ends_at,explore_ends_at,active_group,known_groups,broadcast_message,broadcast_message_at')
      .eq('id',1).single();
    if (error) throw error;

      investor_budget: Math.max(0, parseInt(settings.investor_budget) || 0),
      min_investment_per_company: Math.max(0, parseInt(settings.min_investment_per_company) || 0),
      max_investment_per_company: Math.max(0, parseInt(settings.max_investment_per_company) || 0),
      min_companies_required: Math.max(0, parseInt(settings.min_companies_required) || 0),
      winner_count: Math.max(1, parseInt(settings.winner_count) || 1),
      winner_formula: (settings.winner_formula === 'investment_only') ? 'investment_only' : 'composite',
      evaluation_frozen: !!settings.evaluation_frozen,
      results_hidden: !!settings.results_hidden,
      registration_open: settings.registration_open === false ? false : true,
      evaluation_ends_at: settings.evaluation_ends_at || null,
      explore_ends_at: settings.explore_ends_at || null,
      active_group: settings.active_group ? String(settings.active_group).trim() : null,
      known_groups: Array.isArray(settings.known_groups) ? settings.known_groups : [],
      broadcast_message: settings.broadcast_message || null,
      broadcast_message_at: settings.broadcast_message_at || null
    };
    if (DEMO_MODE){ Object.assign(demoStore.event_state, clean); return; }
    const { error } = await supabaseClient.from('event_state').update({ ...clean, updated_at: new Date().toISOString() }).eq('id',1);
    if (error) throw error;
  },
  onPhaseChange(cb){
    let lastPhase = null;
    const maybeNotify = (p)=>{ if (p !== lastPhase){ lastPhase = p; cb(p); } };
    if (DEMO_MODE){ setInterval(()=>maybeNotify(demoStore.event_state.phase), 1500); return; }
    supabaseClient.channel('event_state_ch')
      .on('postgres_changes', { event:'UPDATE', schema:'public', table:'event_state' }, payload=>{
        maybeNotify(payload.new.phase);
      }).subscribe();
    setInterval(async ()=>{ try{ maybeNotify(await DB.getPhase()); }catch(err){ /* يُعاد المحاولة في الدورة التالية */ } }, 4000);
  },

  async getCompanies(){

      .single();

    const { error } = await supabaseClient.from('companies').update({ group_tag: groupTag || null }).eq('id', id);
    if (error) throw error;

      const co = demoStore.companies.find(c=>c.id===id);
      if (co) Object.assign(co, fields);
      return;

  async deleteEvaluation(id){

  async createInvestor(email, username, password, name){
    username = String(username).trim().toLowerCase();
    email = String(email).trim().toLowerCase();
    name = name ? String(name).trim() : null;
    if (DEMO_MODE){
      if (demoStore.investors.find(i=>i.username===username)) throw new Error('اسم المستخدم مستخدم مسبقاً');
      if (demoStore.investors.find(i=>i.email===email)) throw new Error('هذا البريد مضاف مسبقاً');
      const inv = { id: uid(), name: name||null, username, email, pin: null };
      demoStore.investors.push(inv);
      return { id: inv.id, email: inv.email, username: inv.username };
    }
    const { data, error } = await supabaseClient.rpc('create_investor', { p_email: email, p_username: username, p_password: '', p_name: name });
    if (error) throw error;
    return data && data[0];
  },
  async verifyInvestor(username, password){
    username = String(username).trim().toLowerCase();
    password = String(password).trim();
    if (DEMO_MODE){
      const inv = demoStore.investors.find(i=>i.username===username && i.password===password);
      return inv ? { id: inv.id, name: inv.name } : null;

    const { data, error } = await supabaseClient.rpc('verify_investor', { p_username: username, p_password: password });
    if (error) throw error;
    return (data && data[0]) || null;

    username = String(username).trim().toLowerCase();
    password = String(password).trim();

    if (DEMO_MODE){
      demoStore.admins = demoStore.admins || [];
      if (demoStore.admins.find(a=>a.username===username)) throw new Error('اسم المستخدم مستخدم مسبقاً');
      const acc = { id: uid(), username, password, role, created_at: new Date().toISOString() };
      demoStore.admins.push(acc);
      return { username, role };
    }
    const { data, error } = await supabaseClient.rpc('create_admin', { p_username: username, p_password: password, p_role: role });
    if (error) throw error;
    return data && data[0];
  },
  async verifyAdmin(username, password){
    username = String(username).trim().toLowerCase();
    password = String(password).trim();
    if (DEMO_MODE){
      demoStore.admins = demoStore.admins || [];

      return a ? { id: a.id, username: a.username, role: a.role||'owner' } : null;

    const { data, error } = await supabaseClient.rpc('verify_admin', { p_username: username, p_password: password });
    if (error) throw error;
    return (data && data[0]) || null;
  },

    if (DEMO_MODE) return (demoStore.admins||[]).map(a=>({ id:a.id, username:a.username, role:a.role||'owner', created_at:a.created_at }));

    if (DEMO_MODE){
      demoStore.audit_log = demoStore.audit_log || [];

  async getAllInvestors(){
    if (DEMO_MODE) return demoStore.investors;
    const { data, error } = await supabaseClient.from('investors').select('id,name,username,evaluation_done,project_number,group_tag,email,created_at');
    if (error) throw error;
    return data || [];
  },

  /* دخول المستثمر بالاسم + رمز بسيط (PIN):
     أول مرة يُدخل فيها اسم جديد، يُنشأ حساب تلقائياً بنفس الرمز.
     أي دخول لاحق بنفس الاسم يتطلب نفس الرمز — يمنع انتحال شخص لاسم غيره. */
  async investorLogin(name, email, projectNumber, pin){
    name = String(name).trim();
    email = String(email).trim().toLowerCase();
    projectNumber = String(projectNumber||'').trim();
    pin = String(pin).trim();
    if (!name) throw new Error('الرجاء إدخال الاسم');
    if (!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error('الرجاء إدخال بريد إلكتروني صحيح');
    if (!pin) throw new Error('الرجاء إدخال الرمز');
    if (DEMO_MODE){
      const existing = demoStore.investors.find(i => i.email === email);
      if (!existing){
        throw new Error('هذا البريد الإلكتروني غير مسجّل ضمن قائمة المدعوين. تواصل مع منظّم الفعالية للتأكد من إضافة بريدك.');
      }
      if (existing.pin == null){
        existing.pin = pin;
        existing.name = existing.name || name; // يُقفَل الاسم من أول تفعيل — لا يُستبدل لو كان محدَّداً مسبقاً
        existing.project_number = existing.project_number || projectNumber || null; // يُقفَل رقم المشروع من أول تفعيل أيضاً
        existing.group_tag = existing.group_tag || demoStore.event_state.active_group || null;
        return { id: existing.id, name: existing.name, project_number: existing.project_number, group_tag: existing.group_tag };
      }
      if (existing.pin !== pin) throw new Error('الرمز غير صحيح لهذا البريد');
      // الاسم ورقم المشروع لا يُعدَّلان أبداً بعد أول تفعيل
      return { id: existing.id, name: existing.name, project_number: existing.project_number, group_tag: existing.group_tag||null };
    }
    const { data, error } = await supabaseClient.rpc('investor_login_or_register', { p_name: name, p_email: email, p_project_number: projectNumber, p_pin: pin });
    if (error) throw error;
    return data && data[0];
  },

  /* وضع الدخول المفتوح القديم (بدون أي رمز) — أُبقي عليه كمرجع احتياطي غير مستخدم حالياً. */
  async findOrCreateInvestorByName(name){
    name = String(name).trim();
    if (!name) throw new Error('الرجاء إدخال الاسم');
    const all = await this.getAllInvestors();
    const existing = all.find(i => i.name.trim().toLowerCase() === name.toLowerCase());
    if (existing) return { id: existing.id, name: existing.name };
    const username = 'guest-' + Math.random().toString(36).slice(2,8);
    const password = Math.random().toString(36).slice(2,10);
    const created = await this.createInvestor(name, username, password);
    return { id: created.id, name };
  }
};

function toast(msg){
  let t = document.querySelector('.toast');
  if (!t){ t = document.createElement('div'); t.className='toast'; document.body.appendChild(t); }
  t.innerHTML = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

function icon(name, opts){
  opts = opts || {};
  const size = opts.size || 18;
  const stroke = opts.stroke || 2;
  const filled = !!opts.filled;
  const cls = opts.class ? ' ' + opts.class : '';
  const body = ICON_PATHS[name] || '';
  const fillAttr = filled ? 'currentColor' : 'none';
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="${fillAttr}" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round" class="im-icon${cls}" style="vertical-align:-4px; flex-shrink:0;">${body}</svg>`;
}

const BRAND_COLORS = ['#9A05B9','#FCC342','#00BF9D','#63D653'];
function ticksHTML(count){
  count = count || 26;
  let out = '';
  for (let i=0;i<count;i++){
    const color = BRAND_COLORS[i % BRAND_COLORS.length];
    const h = 8 + ((i*7)%3===0 ? 14 : (i*5)%2===0 ? 9 : 5);
    out += `<span style="height:${h}px;background:${color}"></span>`;
  }
  return `<div class="brand-ticks">${out}</div>`;
}
function logoLockup(dark){
  const cls = dark ? 'logo-lockup on-dark' : 'logo-lockup';
  const boxCls = dark ? 'logo-num-box on-dark' : 'logo-num-box';
  return `
    <div class="${cls}">

      <div class="logo-text">
        <b>حاضنة ابتكار</b>
        <span class="en">Innovation Incubator</span>

async function adminSetup(){
  const u = document.getElementById('newAdminUsername').value.trim();
  const p1 = document.getElementById('newAdminPassword').value;
  const p2 = document.getElementById('newAdminPassword2').value;
  if (!u || !p1){ toast('الرجاء تعبئة جميع الحقول'); return; }
  if (p1.length < 8){ toast('كلمة المرور يجب أن تكون 8 أحرف على الأقل'); return; }
  if (p1 !== p2){ toast('كلمتا المرور غير متطابقتين'); return; }
  try{
    const acc = await DB.createAdmin(u, p1, 'owner');
    toast(icon('check-circle',{size:16}) + ' تم إنشاء الحساب بنجاح');
    enterAdminApp({ username: u, role: 'owner', ...acc });
  }catch(err){
    toast('تعذّر إنشاء الحساب — قد يكون اسم المستخدم مستخدماً بالفعل');
  }
}
async function adminLogin(){
  const u = document.getElementById('adminUsername').value.trim();
  const p = document.getElementById('adminPassword').value;
  if (!u || !p){ toast('الرجاء إدخال اسم المستخدم وكلمة المرور'); return; }
  try{
    const acc = await DB.verifyAdmin(u, p);
    if (!acc){ toast('اسم المستخدم أو كلمة المرور غير صحيحة'); return; }
    enterAdminApp(acc);
  }catch(err){
    toast('تعذّر الاتصال، حاول مرة أخرى');
  }
}

function isUserTypingInForm(){
  const active = document.activeElement;
  const contentEl = document.getElementById('content');
  return !!(active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA' || active.tagName==='SELECT') && contentEl && contentEl.contains(active));
}
function safeRender(){ if (!isUserTypingInForm()) render(); }

async function checkScheduledPhaseTransitionsAdmin(){
  try{
    const now = Date.now();
    if (PHASE === 'explore' && SETTINGS.explore_ends_at && now >= new Date(SETTINGS.explore_ends_at).getTime()){
      await DB.setPhase('evaluation'); PHASE = 'evaluation';
    } else if (PHASE === 'evaluation' && SETTINGS.evaluation_ends_at && now >= new Date(SETTINGS.evaluation_ends_at).getTime()){
      await DB.setPhase('results'); PHASE = 'results';
    }
  }catch(err){ /* يُعاد المحاولة بالدورة القادمة */ }
}

async function boot(){
  try{
    await refresh();
    render();
    DB.onPhaseChange(async p=>{ PHASE=p; document.getElementById('phasePill').textContent = phaseLabel(p); document.getElementById('phasePill').style.background = phaseColor(p); safeRender(); });
    setInterval(refresh, 6000);
    setInterval(safeRender, 6000);
    setInterval(checkScheduledPhaseTransitionsAdmin, 6000);
  }catch(err){
    console.error('boot() failed:', err);
    document.getElementById('content').innerHTML = `
      <div class="lock-banner" style="border-color:var(--danger); text-align:right;">
        <b style="color:var(--danger);">${icon('alert-triangle',{size:16})} تعذّر تحميل البيانات من قاعدة البيانات${err.__step ? ' (فشل عند: '+err.__step+')' : ''}</b><br>
        <span style="font-family:monospace; font-size:12px; word-break:break-all;">${(err && (err.message||err.details||err.hint)) || JSON.stringify(err)}</span><br>
        <span class="muted">أرسل هذه الرسالة كاملة للدعم الفني لتشخيص المشكلة بدقة.</span>
      </div>
    `;
  }
}
async function refresh(){
  const step = async (label, fn) => {
    try{ return await fn(); }
    catch(err){ err.__step = label; throw err; }
  };
  COMPANIES = await step('companies', ()=>DB.getCompanies());
  PHASE = await step('phase', ()=>DB.getPhase());
  BUDGET = await step('budget', ()=>DB.getBudget());
  SETTINGS = await step('settings', ()=>DB.getSettings());
  VISITS = await step('visits', ()=>DB.getAllVisits());
  EVALS = await step('evaluations', ()=>DB.getAllEvaluations());
  INVESTORS = await step('investors', ()=>DB.getAllInvestors());
  try{ ADMIN_LIST = await DB.listAdmins(); }catch(err){ /* شغّل migration_19 لو فشل هذا */ }
  try{ AUDIT_LOG_ENTRIES = await DB.getAuditLog(50); }catch(err){ /* شغّل migration_19 لو فشل هذا */ }
  document.getElementById('phasePill').textContent = phaseLabel(PHASE);
  document.getElementById('phasePill').style.background = phaseColor(PHASE);
}

};
function setFilter(section, key, value){ FILTER_STATE[section][key] = value; render(); }
function setSort(section, col){
  const f = FILTER_STATE[section];
  if (f.sortBy === col) f.sortDir = (f.sortDir === 'asc') ? 'desc' : 'asc';
  else { f.sortBy = col; f.sortDir = 'asc'; }
  render();
}
function sortIndicator(section, col){
  const f = FILTER_STATE[section];
  if (f.sortBy !== col) return '';
  return f.sortDir === 'asc' ? ' ▲' : ' ▼';
}

function toggleAcc(summaryEl, key){
  const details = summaryEl.parentElement;
  const body = details.querySelector('.acc-body');
  const willOpen = !details.open;
  ACC_STATE[key] = willOpen;

  if (!willOpen){
    const h = body.scrollHeight;
    body.style.height = h + 'px';
    body.offsetHeight;
    body.style.transition = 'height .26s cubic-bezier(.4,0,.2,1)';
    body.style.height = '0px';
    body.addEventListener('transitionend', function te(){
      details.removeAttribute('open');
      body.style.transition = ''; body.style.height = '';
      body.removeEventListener('transitionend', te);
    }, { once:true });
  } else {
    details.setAttribute('open','');
    const h = body.scrollHeight;
    body.style.height = '0px';
    body.offsetHeight;
    body.style.transition = 'height .26s cubic-bezier(.4,0,.2,1)';
    body.style.height = h + 'px';
    body.addEventListener('transitionend', function te(){
      body.style.transition = ''; body.style.height = '';
      body.removeEventListener('transitionend', te);
    }, { once:true });
  }
}

function computeInvestorActivity(){
  const companyName = {}; COMPANIES.forEach(co=>companyName[co.id]=co.name);
  return INVESTORS.map(inv=>{
    let last = null;
    VISITS.filter(v=>v.investor_id===inv.id).forEach(v=>{
      const at = new Date(v.visited_at).getTime();
      if (!last || at > last.at) last = { type:'زيارة', icon:'compass', at, detail: companyName[v.company_id]||'—' };
    });
    EVALS.filter(e=>e.investor_id===inv.id).forEach(e=>{
      const at = new Date(e.submitted_at).getTime();
      if (!last || at > last.at) last = { type:'تقييم', icon:'edit', at, detail: companyName[e.company_id]||'—' };
    });
    return { investor: inv, last };
  }).filter(x=>x.last).sort((a,b)=>b.last.at - a.last.at);
}
function timeAgo(ts){
  const diffSec = Math.round((Date.now() - ts) / 1000);
  if (diffSec < 60) return 'الآن';
  if (diffSec < 3600) return `منذ ${Math.round(diffSec/60)} دقيقة`;
  if (diffSec < 86400) return `منذ ${Math.round(diffSec/3600)} ساعة`;
  return `منذ ${Math.round(diffSec/86400)} يوم`;
}

function computeSmartAlerts(){
  const alerts = [];
  const visitedCompanyIds = new Set(VISITS.map(v=>v.company_id));
  const unvisited = COMPANIES.filter(co=>!visitedCompanyIds.has(co.id));
  if (unvisited.length){
    alerts.push({ text: `${unvisited.length} شركة ما زارها أي مستثمر بعد`, detail: unvisited.map(c=>c.name).join('، ') });
  }
  const pendingCount = INVESTORS.filter(i=>!i.evaluation_done).length;
  if (pendingCount && SETTINGS.evaluation_ends_at){
    const minsLeft = (new Date(SETTINGS.evaluation_ends_at).getTime() - Date.now()) / 60000;
    if (minsLeft > 0 && minsLeft < 30){
      alerts.push({ text: `${pendingCount} مستثمر ما أنهى التقييم رغم اقتراب الموعد (${Math.round(minsLeft)} دقيقة متبقية)`, detail: '' });
    }
  }
  const outOfRange = EVALS.filter(e => e.investment_amount>0 && (e.investment_amount < SETTINGS.min_investment_per_company || e.investment_amount > SETTINGS.max_investment_per_company));
  if (outOfRange.length){
    alerts.push({ text: `${outOfRange.length} استثمار خارج الحدود المسموحة بالإعدادات`, detail: '' });
  }
  return alerts;
}

function handleGlobalSearch(q){
  const box = document.getElementById('globalSearchResults');
  q = (q||'').trim().toLowerCase();
  if (!q){ box.style.display = 'none'; box.innerHTML=''; return; }

  const companyMatches = COMPANIES.filter(co => co.name.toLowerCase().includes(q) || (co.sector||'').toLowerCase().includes(q)).slice(0,6);
  const investorMatches = INVESTORS.filter(i => (i.name||'').toLowerCase().includes(q) || (i.email||'').toLowerCase().includes(q)).slice(0,6);

  if (!companyMatches.length && !investorMatches.length){
    box.innerHTML = `<div class="muted" style="padding:14px; text-align:center;">لا توجد نتائج مطابقة</div>`;
    box.style.display = 'block';
    return;
  }

  let html = '';
  if (companyMatches.length){
    html += `<div class="muted" style="padding:8px 14px 4px; font-size:11px; font-weight:800;">الشركات</div>`;
    html += companyMatches.map(co=>`
      <div style="padding:10px 14px; cursor:pointer; display:flex; align-items:center; gap:8px;" onmouseover="this.style.background='#faf9ff'" onmouseout="this.style.background=''" onclick="jumpToCompany('${co.id}','${(co.name||'').replace(/'/g,"\\'")}')">
        ${icon(co.emoji||'briefcase',{size:14})} <span style="font-size:13px;">${co.name}</span> <span class="muted" style="font-size:11px;">${co.sector||''}</span>
      </div>
    `).join('');
  }
  if (investorMatches.length){
    html += `<div class="muted" style="padding:8px 14px 4px; font-size:11px; font-weight:800; border-top:1px solid var(--line); margin-top:4px;">المستثمرون</div>`;
    html += investorMatches.map(i=>`
      <div style="padding:10px 14px; cursor:pointer; display:flex; align-items:center; gap:8px;" onmouseover="this.style.background='#faf9ff'" onmouseout="this.style.background=''" onclick="jumpToInvestor('${(i.name||i.email||'').replace(/'/g,"\\'")}')">
        ${icon('users',{size:14})} <span style="font-size:13px;">${i.name || '<span class="muted" style="font-style:italic;">بانتظار أول دخول</span>'}</span> <span class="muted" style="font-size:11px;">${i.email||''}</span>
      </div>
    `).join('');
  }
  box.innerHTML = html;
  box.style.display = 'block';
}

  const miniCard = (iconName, val, label, opts={}) => `

    miniCard('briefcase', COMPANIES.length, 'شركة مشاركة', { iconColor:'var(--purple)' }) +
    miniCard('users', INVESTORS.length, 'مستثمر مسجّل', { iconColor:'var(--teal-dark)' }) +
    miniCard('check-circle', pct+'%', `أنهوا التقييم (${finishedCount}/${INVESTORS.length||0})`, { iconColor:'var(--teal-dark)', numColor:'var(--teal-dark)', progress: pct }) +

    );
}

  }

function computeValuation(score, totalInvested){
  if (SETTINGS.winner_formula === 'investment_only') return Math.round(totalInvested);
  return Math.round(score*40 + totalInvested*10);
}

function filteredInvestors(){
  const f = FILTER_STATE.investors;
  let list = [...INVESTORS];
  if (f.search){
    const s = f.search.toLowerCase();
    list = list.filter(i=>(i.name||'').toLowerCase().includes(s) || (i.email||'').toLowerCase().includes(s));
  }
  if (f.status === 'done') list = list.filter(i=>i.evaluation_done);
  if (f.status === 'pending') list = list.filter(i=>!i.evaluation_done);
  if (f.group) list = list.filter(i=>i.group_tag===f.group);
  list.sort((a,b)=>{
    let av,bv;
    if (f.sortBy==='project'){ av=a.project_number||''; bv=b.project_number||''; }
    else { av=a.name||''; bv=b.name||''; }
    if (typeof av==='string') return f.sortDir==='asc' ? av.localeCompare(bv,'ar') : bv.localeCompare(av,'ar');
    return f.sortDir==='asc' ? av-bv : bv-av;
  });
  return list;
}

function filteredCompanies(){
  const f = FILTER_STATE.companies;
  const visitCount = {}; VISITS.forEach(v=>visitCount[v.company_id]=(visitCount[v.company_id]||0)+1);
  const evalCount = {}; EVALS.forEach(e=>evalCount[e.company_id]=(evalCount[e.company_id]||0)+1);
  let list = COMPANIES.map(co=>({ co, visits: visitCount[co.id]||0, evals: evalCount[co.id]||0 }));
  if (f.search){
    const s = f.search.toLowerCase();
    list = list.filter(x=> x.co.name.toLowerCase().includes(s) || (x.co.sector||'').toLowerCase().includes(s));
  }
  if (f.sector) list = list.filter(x=>x.co.sector===f.sector);
  if (f.group) list = list.filter(x=>x.co.group_tag===f.group);
  list.sort((a,b)=>{
    let av,bv;
    if (f.sortBy==='sector'){ av=a.co.sector||''; bv=b.co.sector||''; }
    else if (f.sortBy==='visits'){ av=a.visits; bv=b.visits; }
    else if (f.sortBy==='evals'){ av=a.evals; bv=b.evals; }
    else { av=a.co.name; bv=b.co.name; }
    if (typeof av==='string') return f.sortDir==='asc' ? av.localeCompare(bv,'ar') : bv.localeCompare(av,'ar');
    return f.sortDir==='asc' ? av-bv : bv-av;
  });
  return list;

function computeReportData(){
  const relevantCompanies = SETTINGS.active_group
    ? COMPANIES.filter(co => co.group_tag === SETTINGS.active_group)
    : COMPANIES;
  return relevantCompanies.map(co=>{
    const coEvals = EVALS.filter(e=>e.company_id===co.id);
    const coVisits = VISITS.filter(v=>v.company_id===co.id);
    const totalInvested = coEvals.reduce((s,e)=>s+e.investment_amount,0);
    const avgRating = coEvals.length
      ? coEvals.reduce((s,e)=>s + (e.innovation+e.market_size+e.team+e.feasibility+e.investability)/5, 0) / coEvals.length
      : 0;
    return {
      name: co.name,
      sector: co.sector || 'غير مصنّف',
      visits: coVisits.length,
      investors: coEvals.length,
      invest: totalInvested,
      rating: Number(avgRating.toFixed(2))
    };
  });
}

function downloadHTMLReport(templateB64, filename){
  if (!COMPANIES.length){ toast('لا توجد شركات لإنشاء التقرير'); return; }
  try{
    const decoded = decodeURIComponent(escape(atob(templateB64)));
    const dataJson = JSON.stringify(computeReportData());
    const finalHtml = decoded.replace('__DATA_PLACEHOLDER__', dataJson);
    const blob = new Blob([finalHtml], { type:'text/html;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    toast(icon('check-circle',{size:16}) + ' تم إنشاء التقرير بنجاح');
  }catch(err){
    console.error('report generation failed:', err);
    toast('تعذّر إنشاء التقرير');
  }
}
function downloadDashboardReport(){ downloadHTMLReport(DASHBOARD_REPORT_B64, 'innovation-marketplace-dashboard.html'); }
function downloadSummaryReport(){ downloadHTMLReport(SUMMARY_REPORT_B64, 'innovation-marketplace-summary.html'); }

function renderAnalysisReport(){
  const relevantCompanies = SETTINGS.active_group
    ? COMPANIES.filter(co => co.group_tag === SETTINGS.active_group)
    : COMPANIES;
  const relevantIds = new Set(relevantCompanies.map(co=>co.id));
  const relevantEvals = EVALS.filter(e => relevantIds.has(e.company_id));

  const allRanked = relevantCompanies.map(co=>{
    const coEvals = EVALS.filter(e=>e.company_id===co.id);
    const totalInvested = coEvals.reduce((s,e)=>s+e.investment_amount,0);
    const score = coEvals.reduce((s,e)=>s + e.innovation+e.market_size+e.team+e.feasibility+e.investability, 0);
    const valuation = computeValuation(score, totalInvested);
    return { company: co, evalCount: coEvals.length, totalInvested, valuation };
  }).sort((a,b)=>b.valuation-a.valuation);

  const totalInvestedOverall = relevantEvals.reduce((s,e)=>s+e.investment_amount,0);
  const investorsWhoEvaluated = new Set(relevantEvals.map(e=>e.investor_id)).size;
  const avgPerInvestor = investorsWhoEvaluated ? Math.round(totalInvestedOverall / investorsWhoEvaluated) : 0;
  const maxValuation = allRanked.length ? allRanked[0].valuation : 1;

  const sectorCounts = {};
  relevantCompanies.forEach(co=>{ const s = co.sector || 'غير محدد'; sectorCounts[s] = (sectorCounts[s]||0)+1; });
  const maxSectorCount = Math.max(1, ...Object.values(sectorCounts));

  return `
    ${SETTINGS.active_group ? `<p class="muted mt8" style="margin-bottom:10px;">${icon('tag',{size:13})} يعرض هذا التقرير فقط شركات البرنامج النشط حالياً: <b style="color:var(--purple);">"${SETTINGS.active_group}"</b> (${relevantCompanies.length} من أصل ${COMPANIES.length} شركة إجمالاً)</p>` : ''}
    <div class="admin-grid">
      <div class="stat-card"><div class="num">${relevantCompanies.length}</div><div class="lbl">شركة مشاركة</div></div>
      <div class="stat-card"><div class="num">${investorsWhoEvaluated}</div><div class="lbl">مستثمر شارك بالتقييم</div></div>
      <div class="stat-card"><div class="num">${totalInvestedOverall.toLocaleString()}</div><div class="lbl">إجمالي الاستثمارات</div></div>
      <div class="stat-card"><div class="num">${avgPerInvestor.toLocaleString()}</div><div class="lbl">متوسط الاستثمار لكل مستثمر</div></div>
    </div>

    <div class="section-title mt24">ترتيب الشركات حسب القيمة التقديرية</div>
    ${allRanked.map((r,i)=>`
      <div class="rank-bar-row">

function companyReport(){
  const f = FILTER_STATE.companyReport;
  let rows = COMPANIES.map(co=>{
    const coVisits = VISITS.filter(v=>v.company_id===co.id);
    const coEvals = EVALS.filter(e=>e.company_id===co.id);
    const totalInvested = coEvals.reduce((s,e)=>s+e.investment_amount,0);
    const avgRating = coEvals.length
      ? coEvals.reduce((s,e)=>s + (e.innovation+e.market_size+e.team+e.feasibility+e.investability)/5, 0) / coEvals.length
      : 0;
    const score = coEvals.reduce((s,e)=>s + e.innovation+e.market_size+e.team+e.feasibility+e.investability, 0);
    const valuation = computeValuation(score, totalInvested);
    return { company: co, visitCount: coVisits.length, evalCount: coEvals.length, totalInvested, avgRating, valuation };
  });
  if (f.search){
    const s = f.search.toLowerCase();
    rows = rows.filter(r=>r.company.name.toLowerCase().includes(s));
  }
  if (f.sector) rows = rows.filter(r=>r.company.sector===f.sector);
  rows.sort((a,b)=>{
    let av,bv;
    if (f.sortBy==='visits'){ av=a.visitCount; bv=b.visitCount; }
    else if (f.sortBy==='evals'){ av=a.evalCount; bv=b.evalCount; }
    else if (f.sortBy==='invested'){ av=a.totalInvested; bv=b.totalInvested; }
    else if (f.sortBy==='rating'){ av=a.avgRating; bv=b.avgRating; }
    else if (f.sortBy==='name'){ av=a.company.name; bv=b.company.name; }
    else { av=a.valuation; bv=b.valuation; }
    if (typeof av==='string') return f.sortDir==='asc' ? av.localeCompare(bv,'ar') : bv.localeCompare(av,'ar');
    return f.sortDir==='asc' ? av-bv : bv-av;
  });
  return rows;
}

function investorInvestmentReport(){
  const f = FILTER_STATE.investorReport;
  const companyMap = {}; COMPANIES.forEach(co=>companyMap[co.id]=co.name);
  let rows = INVESTORS.map(inv=>{
    const myEvals = EVALS.filter(e=>e.investor_id===inv.id && e.investment_amount>0);
    const items = myEvals.map(e=>({ evalId: e.id, companyName: companyMap[e.company_id]||'—', amount: e.investment_amount }))
                          .sort((a,b)=>b.amount-a.amount);
    const total = items.reduce((s,it)=>s+it.amount,0);
    return { investor: inv, items, total };
  });
  if (f.search){
    const s = f.search.toLowerCase();
    rows = rows.filter(r=>r.investor.name.toLowerCase().includes(s));
  }
  if (f.sortBy === 'name'){
    rows.sort((a,b)=> f.sortDir==='asc' ? a.investor.name.localeCompare(b.investor.name,'ar') : b.investor.name.localeCompare(a.investor.name,'ar'));
  } else {
    rows.sort((a,b)=> f.sortDir==='asc' ? a.total-b.total : b.total-a.total);
  }
  return rows;
}
function setInvestorReportSort(sortBy){

function previewBulkInvestors(){
  const raw = document.getElementById('bulkNames').value;
  const lines = raw.split('\n').map(n=>n.trim()).filter(Boolean);
  if (!lines.length){ toast('الرجاء إدخال بريد إلكتروني واحد على الأقل'); return; }

  const emailRe = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
  const existingEmails = new Set(INVESTORS.map(i=>(i.email||'').toLowerCase()));
  const seenInBatch = new Set();
  const valid = [], duplicates = [];
  let invalidCount = 0;

  lines.forEach(line=>{
    const parts = line.split(',').map(s=>s.trim());
    let name = '', email = '';
    if (parts.length >= 2){ name = parts[0]; email = parts[1]; }
    else { email = parts[0]; }
    email = email.toLowerCase();
    if (!emailRe.test(email)){ invalidCount++; return; }
    if (existingEmails.has(email) || seenInBatch.has(email)){ duplicates.push(email); return; }
    seenInBatch.add(email);
    valid.push({ name, email });
  });

  PENDING_BULK_ENTRIES = { valid, duplicates, invalidCount };
  render();
}

async function confirmBulkInvestors(){
  if (!requireEditPermission()) return;
  if (!PENDING_BULK_ENTRIES || !PENDING_BULK_ENTRIES.valid.length) return;
  const entries = PENDING_BULK_ENTRIES.valid;

  let successCount = 0;
  const failures = [];
  for (const entry of entries){
    // معرّف عشوائي فريد مبني على البريد نفسه — يتفادى أي تصادم حتى لو كانت القائمة المحلية غير محدَّثة بالكامل
    const emailSlug = entry.email.split('@')[0].toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,15) || 'inv';
    const password = genPassword(); // داخلي فقط، غير مستخدم لتسجيل الدخول
    let lastErr = null;
    let done = false;
    for (let attempt=0; attempt<3 && !done; attempt++){
      const username = `${emailSlug}-${Math.random().toString(36).slice(2,8)}`;
      try{
        await DB.createInvestor(entry.email, username, password, entry.name);
        successCount++;
        done = true;
      }catch(err){
        lastErr = err;
        // لو التصادم بسبب اسم المستخدم تحديداً، أعد المحاولة برمز عشوائي جديد
        const msg = (err && (err.message||err.details||err.hint)) || '';
        if (!/username/i.test(msg)) break; // أي خطأ آخر (زي بريد مكرر) ما ينفع نعيد المحاولة له
      }
    }
    if (!done){
      console.error('createInvestor failed for', entry.email, ':', lastErr);
      failures.push({ email: entry.email, message: (lastErr && (lastErr.message||lastErr.details||lastErr.hint)) || JSON.stringify(lastErr) });
    }
  }

  document.getElementById('bulkNames').value = '';
  PENDING_BULK_ENTRIES = null;
  await refresh();
  render();
  logAdminAction('إضافة مستثمرين بالجملة', `${successCount} مشارك`);
  if (failures.length){
    console.error('bulk add failures:', failures);
    const uniqueMsgs = [...new Set(failures.map(f=>f.message))];
    alert(`فشلت إضافة ${failures.length} من ${entries.length}.\n\nسبب الفشل:\n${uniqueMsgs.join('\n')}\n\nراجع Console (F12) لتفاصيل كل بريد.`);
  }
  toast(icon('check-circle',{size:16}) + ` تمت إضافة ${successCount} مشارك`);
}

  if (password.length < 8){ toast('كلمة المرور يجب أن تكون 8 أحرف على الأقل'); return; }
  try{
    await DB.createAdmin(username, password, role);
    logAdminAction('إضافة منظّم جديد', `${username} (${role})`);
    document.getElementById('newSubAdminUser').value = '';
    document.getElementById('newSubAdminPass').value = '';
    await refresh(); render();
    toast(icon('check-circle',{size:16}) + ' تمت إضافة المنظّم بنجاح');
  }catch(err){
    console.error('addSubAdmin failed:', err);
    toast('تعذّر الإضافة — قد يكون اسم المستخدم مستخدماً بالفعل');
  }
}
async function removeSubAdmin(id, username){
  if (!isOwner()){ toast('فقط حساب "مالك" يقدر يحذف منظّمين'); return; }
  if (!confirm(`حذف حساب المنظّم "${username}" نهائياً؟`)) return;
  try{
    await DB.deleteAdmin(id);
    logAdminAction('حذف منظّم', username);
    await refresh(); render();
    toast(icon('check-circle',{size:16}) + ' تم الحذف');
  }catch(err){
    console.error('removeSubAdmin failed:', err);
    toast(err.message || 'تعذّر الحذف');
  }
}
async function removeInvestor(id, name){
  if (!requireEditPermission()) return;
  if (!confirm(`حذف المستثمر "${name}" نهائياً؟ سيُحذف معه كل زياراته ومتابعته وتقييماته. لا يمكن التراجع.`)) return;
  try{
    await DB.deleteInvestor(id);
    logAdminAction('حذف مستثمر', name);
    await refresh(); render();
    toast(icon('check-circle',{size:16}) + ' تم الحذف');
  }catch(err){
    console.error('removeInvestor failed:', err);
    toast('تعذّر الحذف');
  }
}
async function removeCompany(id){
  if (!requireEditPermission()) return;
  if (!confirm('حذف هذه الشركة نهائياً؟')) return;
  const co = COMPANIES.find(c=>c.id===id);
  await DB.deleteCompany(id);
  logAdminAction('حذف شركة', co ? co.name : id);
  await refresh(); render();
}

async function removeInvestment(evalId){
  if (!requireEditPermission()) return;
  if (!confirm('حذف هذا الاستثمار نهائياً؟ لا يمكن التراجع عن هذا الإجراء.')) return;
  try{
    await DB.deleteEvaluation(evalId);
    await refresh(); render();
    logAdminAction('حذف استثمار', evalId);
    toast(icon('check-circle',{size:16}) + ' تم حذف الاستثمار');
  }catch(err){
    console.error('deleteEvaluation failed:', err);
    toast('تعذّر حذف الاستثمار');
  }
}

function exportFullBackup(){
  const backup = {
    exported_at: new Date().toISOString(),
    settings: SETTINGS,
    companies: COMPANIES,
    investors: INVESTORS,
    visits: VISITS,
    evaluations: EVALS,
    admin_list: ADMIN_LIST,
    audit_log: AUDIT_LOG_ENTRIES
  };
  const json = JSON.stringify(backup, null, 2);
  const blob = new Blob([json], { type:'application/json;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `innovation-marketplace-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  logAdminAction('تنزيل نسخة احتياطية كاملة', '');
  toast(icon('check-circle',{size:16}) + ' تم تنزيل النسخة الاحتياطية');
}

function exportCSV(){
  const investorMap = {}; INVESTORS.forEach(i=>investorMap[i.id]=i.name);
  const companyMap = {}; COMPANIES.forEach(c=>companyMap[c.id]=c.name);
  let rows = [['المستثمر','الشركة','الابتكار','حجم السوق','الفريق','إمكانية التنفيذ','القابلية للاستثمار','مبلغ الاستثمار','ملاحظات']];
  EVALS.forEach(e=>{
    rows.push([
      investorMap[e.investor_id]||e.investor_id,
      companyMap[e.company_id]||e.company_id,
      e.innovation, e.market_size, e.team, e.feasibility, e.investability, e.investment_amount, e.notes||''
    ]);
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(["\uFEFF"+csv], { type:'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'innovation-marketplace-results.csv';
  a.click();
}
